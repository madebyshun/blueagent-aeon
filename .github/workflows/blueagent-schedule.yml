name: Blue Agent Schedule

on:
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 9 * * *"
    - cron: "0 12 * * *"
    - cron: "30 13 * * *"
    - cron: "0 14 * * *"
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      skill:
        description: 'Skill to run'
        required: true
        type: choice
        options:
          - token-pick
          - token-movers
          - narrative-tracker
          - morning-brief
          - defi-monitor
          - deal-flow
          - github-trending
          - security-digest

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch skill(s)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SKILLS="${{ github.event.inputs.skill }}"
          else
            case "${{ github.event.schedule }}" in
              "0 7 * * *")   SKILLS="morning-brief" ;;
              "0 9 * * *")   SKILLS="github-trending" ;;
              "0 12 * * *")  SKILLS="token-pick token-movers defi-monitor" ;;
              "30 13 * * *") SKILLS="narrative-tracker" ;;
              "0 14 * * 1")  SKILLS="deal-flow" ;;
              "0 14 * * *")  SKILLS="security-digest" ;;
              *) echo "Unknown schedule: ${{ github.event.schedule }}"; exit 1 ;;
            esac
          fi

          for SKILL in $SKILLS; do
            echo "Dispatching: $SKILL"
            gh workflow run aeon.yml -R "$REPO" --field skill="$SKILL"
            sleep 5
          done
